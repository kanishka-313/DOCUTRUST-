<div class="list-wrap">
  <div class="list-header">
    <span class="eyebrow">Corpus · {{ docs().length }}</span>
  </div>

  @if (docs().length === 0) {
    <div class="empty">No documents indexed yet.</div>
  }

  <div class="list">
    @for (d of docs(); track d.id) {
      <div class="doc">
        <div class="doc-icon">PDF</div>
        <div class="doc-body">
          <div class="doc-name" [title]="d.filename">{{ d.filename }}</div>
          <div class="doc-meta mono">
            <span>{{ d.pages }} pages</span>
            <span class="dot">·</span>
            <span>{{ d.chunk_count }} chunks</span>
            <span class="dot">·</span>
            <span>{{ fmtBytes(d.bytes) }}</span>
          </div>
        </div>
        <button class="remove" (click)="remove(d.id, $event)" title="Remove">×</button>
      </div>
    }
  </div>
</div>

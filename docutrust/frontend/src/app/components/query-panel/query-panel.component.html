<div class="query-card">
  <label class="eyebrow">Ask</label>
  <textarea
    [(ngModel)]="question"
    (keydown)="onKey($event)"
    placeholder="What does section 4.2 say about data retention?"
    rows="3"
    [disabled]="submitting()"
  ></textarea>
  <div class="row">
    <span class="hint mono">⌘ + Enter to submit</span>
    <button class="submit" (click)="submit()" [disabled]="submitting()">
      {{ submitting() ? 'Dispatching…' : 'Ask' }}
    </button>
  </div>
  @if (error()) {
    <div class="error">{{ error() }}</div>
  }
</div>

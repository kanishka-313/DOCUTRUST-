version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docutrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docutrust
      POSTGRES_PASSWORD: docutrust
      POSTGRES_DB: docutrust
    ports:
      - "5432:5432"
    volumes:
      - docutrust_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docutrust"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  docutrust_pgdata:
